name: Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # The runner already carries an Android SDK. Calling its sdkmanager directly
      # avoids the cmdline-tools version that android-actions/setup-android@v3 picks.
      - name: Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=sdkmanager; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      # app/libs/sherpa-onnx-arm64.aar and the wake-word models are not in git.
      # The cache makes later runs skip the ~100 MB download.
      - name: Cache speech library and models
        uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ runner.os }}-${{ hashFiles('tools/models/fetch-models.sh') }}

      - name: Fetch speech library and models
        run: |
          chmod +x tools/models/fetch-models.sh
          tools/models/fetch-models.sh

      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest lintRelease assembleRelease :desktop:build
